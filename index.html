<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Portfolio Tracker</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Stock Portfolio Tracker</h1>
      <p class="subtitle">Enter your holdings to see profit and loss for each position and your whole portfolio.</p>
    </header>

    <section class="card">
      <div class="card-header">
        <h2>Your Positions</h2>
        <button type="button" id="add-row" class="btn btn-secondary">+ Add position</button>
      </div>

      <form id="portfolio-form">
        <div class="table-wrap">
          <table class="input-table">
            <thead>
              <tr>
                <th>Ticker</th>
                <th>Shares</th>
                <th>Purchase price</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="positions-body">
              <tr class="position-row">
                <td><input type="text" name="ticker" placeholder="AAPL" required maxlength="10"></td>
                <td><input type="number" name="shares" placeholder="10" min="0.0001" step="any" required></td>
                <td><input type="number" name="purchase_price" placeholder="150.00" min="0.01" step="0.01" required></td>
                <td><button type="button" class="btn btn-ghost remove-row" title="Remove">×</button></td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="actions">
          <button type="submit" id="analyze-btn" class="btn btn-primary">Analyze portfolio</button>
        </div>
      </form>
    </section>

    <section id="results-section" class="card hidden">
      <div class="card-header">
        <h2>Results</h2>
        <span id="updated-at" class="muted"></span>
      </div>

      <div class="table-wrap">
        <table class="results-table">
          <thead>
            <tr>
              <th>Ticker</th>
              <th>Shares</th>
              <th>Purchase</th>
              <th>Cost basis</th>
              <th>Current</th>
              <th>Value</th>
              <th>P/L ($)</th>
              <th>P/L (%)</th>
            </tr>
          </thead>
          <tbody id="results-body"></tbody>
          <tfoot id="results-foot"></tfoot>
        </table>
      </div>
    </section>

    <div id="error-banner" class="error-banner hidden"></div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
